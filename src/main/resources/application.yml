spring:
  application:
    name: poultry-prophet-backend

  # Supply database credentials through the deployment environment. No
  # production-capable credential may be committed or used as a fallback.
  datasource:
    url: ${SPRING_DATASOURCE_URL}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    defer-datasource-initialization: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: false
        jdbc:
          time_zone: UTC
    open-in-view: false

  sql:
    init:
      mode: always

server:
  port: ${PORT:${SERVER_PORT:8080}}

# Optional Render self-ping. Set APP_RENDER_URL in the deployed service to
# keep a free instance warm; leaving it unset disables the scheduler action.
app:
  time-zone: ${APP_TIME_ZONE:Asia/Manila}
  release:
    version: ${APP_VERSION:0.1.0-validation}
    commit-sha: ${APP_COMMIT_SHA:unknown}
    build-time: ${APP_BUILD_TIME:unknown}
    environment: ${APP_ENVIRONMENT:local}
    frontend-version: ${APP_FRONTEND_VERSION:0.1.0-validation}
  legacy:
    # Production stays fail-closed. Enable only for a separately approved, owner-reviewed repair.
    allow-mortality-reconciliation: ${APP_ALLOW_LEGACY_MORTALITY_RECONCILIATION:false}
  render:
    url: ${APP_RENDER_URL:}
  keep-alive:
    initial-delay-ms: ${APP_KEEP_ALIVE_INITIAL_DELAY_MS:60000}
    fixed-rate-ms: ${APP_KEEP_ALIVE_FIXED_RATE_MS:600000}

# Application-specific configuration.
poultry:
  security:
    # Required: Base64-encoded secret of at least 256 bits (32 bytes).
    jwt-secret: ${JWT_SECRET}
    jwt-expiration-ms: ${JWT_EXPIRATION_MS:86400000} # 24h
    allowed-origins: ${APP_ALLOWED_ORIGINS:http://localhost:3000}
  analytics:
    # Composite BHI weights (configuration-driven, per SDD 2.1). Normalised internally.
    weights:
      temperature: 0.30
      mortality: 0.35
      feed: 0.20
      water: 0.15
    # Recent window (days) used to compute intake deviations and trends.
    window-days: 14
    # Stage target dry-bulb temperatures (deg C). Provisional, per published poultry ranges.
    stage-target-temp:
      brooding: 33.0
      ranging: 28.0
      pre-conditioning: 26.0
      maintenance: 26.0
      conditioning: 24.0
  # Conditioning Readiness scoring (Blueprint section 6). All weights/thresholds are
  # documented, adjustable starting values - NOT established facts. Normalised internally.
  scoring:
    # Composite CRS weights: brooding health + growth lead; health history + behaviour support.
    crs-weights:
      brooding-health: 0.30
      growth: 0.30
      health-history: 0.20
      behavioural: 0.20
    # Brooding Health Index sub-weights (mortality is the strongest literature-backed signal).
    bhi-weights:
      mortality: 0.50
      intake: 0.30
      temperature: 0.20
    # Cumulative brooding mortality band: <=1% scores 100, >=5% scores 0, linear between.
    mortality-best-pct: 1.0
    mortality-worst-pct: 5.0
    # Growth: each 1% deviation from the expected weight curve costs this many points.
    growth-penalty-per-pct: 2.0
    # Health history deductions per logged event severity (start at 100, subtract).
    health-deduction:
      routine: 0.0
      minor: 5.0
      moderate: 15.0
      major: 30.0
    # Expected ranging weight curve (grams by age in weeks). Provisional game fowl ranges;
    # linear interpolation between points. Suggested month-5 advancement cut-line on CRS.
    expected-weight:
      - { week: 4, grams: 300.0 }
      - { week: 8, grams: 700.0 }
      - { week: 12, grams: 1100.0 }
      - { week: 16, grams: 1500.0 }
      - { week: 20, grams: 1900.0 }
    cut-line-crs: 70.0
  report:
    output-dir: ${REPORT_OUTPUT_DIR:./reports}

logging:
  level:
    org.hibernate.SQL: warn
