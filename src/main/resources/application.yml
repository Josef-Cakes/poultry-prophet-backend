spring:
  application:
    name: poultry-prophet-backend

  # Keep local development predictable when DevTools is present.
  devtools:
    restart:
      enabled: false

  # Load optional local settings from the git-ignored .env file.
  config:
    import: optional:file:.env[.properties]

  # Supply database credentials through the deployment environment. No
  # production-capable credential may be committed or used as a fallback.
  datasource:
    url: ${SPRING_DATASOURCE_URL}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    defer-datasource-initialization: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: false
        jdbc:
          time_zone: UTC
    open-in-view: false

  sql:
    init:
      mode: always

server:
  port: ${PORT:${SERVER_PORT:8080}}

app:
  time-zone: ${APP_TIME_ZONE:Asia/Manila}
  release:
    version: ${APP_VERSION:0.1.0-validation}
    commit-sha: ${APP_COMMIT_SHA:unknown}
    build-time: ${APP_BUILD_TIME:unknown}
    environment: ${APP_ENVIRONMENT:local}
    frontend-version: ${APP_FRONTEND_VERSION:0.1.0-validation}
  legacy:
    allow-mortality-reconciliation: ${APP_ALLOW_LEGACY_MORTALITY_RECONCILIATION:false}
  render:
    url: ${APP_RENDER_URL:}
  keep-alive:
    initial-delay-ms: ${APP_KEEP_ALIVE_INITIAL_DELAY_MS:60000}
    fixed-rate-ms: ${APP_KEEP_ALIVE_FIXED_RATE_MS:600000}

poultry:
  security:
    # Required: Base64-encoded secret of at least 256 bits (32 bytes).
    jwt-secret: ${JWT_SECRET}
    jwt-expiration-ms: ${JWT_EXPIRATION_MS:86400000}
    allowed-origins: ${APP_ALLOWED_ORIGINS:http://localhost:3000}
  analytics:
    weights:
      temperature: 0.30
      mortality: 0.35
      feed: 0.20
      water: 0.15
    window-days: 14
    stage-target-temp:
      brooding: 33.0
      ranging: 28.0
      pre-conditioning: 26.0
      maintenance: 26.0
      conditioning: 24.0
  scoring:
    crs-weights:
      brooding-health: 0.30
      growth: 0.30
      health-history: 0.20
      behavioural: 0.20
    bhi-weights:
      mortality: 0.50
      intake: 0.30
      temperature: 0.20
    mortality-best-pct: 1.0
    mortality-worst-pct: 5.0
    growth-penalty-per-pct: 2.0
    health-deduction:
      routine: 0.0
      minor: 5.0
      moderate: 15.0
      major: 30.0
    expected-weight:
      - { week: 4, grams: 300.0 }
      - { week: 8, grams: 700.0 }
      - { week: 12, grams: 1100.0 }
      - { week: 16, grams: 1500.0 }
      - { week: 20, grams: 1900.0 }
    cut-line-crs: 70.0
  report:
    output-dir: ${REPORT_OUTPUT_DIR:./reports}

logging:
  level:
    org.hibernate.SQL: warn
