services:
  - type: web
    name: poultry-prophet-backend
    runtime: docker
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: APP_ENVIRONMENT
        value: production
      # A deployment must not silently mutate schema or baseline an existing database.
      - key: SPRING_JPA_HIBERNATE_DDL_AUTO
        value: validate
      - key: SPRING_SQL_INIT_MODE
        value: never
      - key: SPRING_FLYWAY_ENABLED
        value: "false"
      # Existing Supabase target upgraded and verified through V33 on 2026-11-22.
      - key: APP_COMMAND_RECEIPTS_ENABLED
        value: "true"
      - key: SPRING_DATASOURCE_URL
        sync: false
      - key: SPRING_DATASOURCE_USERNAME
        sync: false
      - key: SPRING_DATASOURCE_PASSWORD
        sync: false
      - key: JWT_SECRET
        generateValue: true
      # RENDER_EXTERNAL_URL is provided by Render; APP_RENDER_URL may override it.
