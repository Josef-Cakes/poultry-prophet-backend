services:
  - type: web
    name: poultry-prophet-backend
    runtime: docker
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: APP_ENVIRONMENT
        value: production
      # A deployment must not silently mutate schema or baseline an existing database.
      - key: SPRING_JPA_HIBERNATE_DDL_AUTO
        value: validate
      - key: SPRING_SQL_INIT_MODE
        value: never
      - key: SPRING_FLYWAY_ENABLED
        value: "false"
      - key: SPRING_DATASOURCE_URL
        sync: false
      - key: SPRING_DATASOURCE_USERNAME
        sync: false
      - key: SPRING_DATASOURCE_PASSWORD
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: APP_RENDER_URL
        value: https://poultry-prophet-backend.onrender.com
