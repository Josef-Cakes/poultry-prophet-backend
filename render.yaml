services:
  - type: web
    name: poultry-prophet-backend
    runtime: docker
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: SPRING_DATASOURCE_URL
        sync: false
      - key: SPRING_DATASOURCE_USERNAME
        sync: false
      - key: SPRING_DATASOURCE_PASSWORD
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: APP_RENDER_URL
        value: https://poultry-prophet-backend.onrender.com
